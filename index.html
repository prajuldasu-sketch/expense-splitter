<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group Expense Splitter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Group Expense Splitter</h1>
    <div class="actions">
      <button id="exportBtn" class="btn btn-ghost">Export CSV</button>
      <button id="themeToggle" class="btn btn-ghost">Toggle Theme</button>
    </div>
  </header>

  <main class="container">
    <section class="cards">
      <div class="card"><span>Total Spent</span><strong id="totalSpent">0.00</strong></div>
      <div class="card"><span>Expenses</span><strong id="totalCount">0</strong></div>
      <div class="card"><span>Members</span><strong id="memberCount">0</strong></div>
    </section>

    <div class="grid">
      <section class="panel">
        <h2>Members</h2>
        <form id="memberForm" class="inline-form">
          <input id="memberName" type="text" placeholder="Member name" required>
          <button type="submit" class="btn">Add</button>
        </form>
        <div id="memberList" class="chips"></div>
      </section>

      <section class="panel">
        <h2>Add Expense</h2>
        <form id="expenseForm">
          <label>Description
            <input id="expDesc" type="text" placeholder="e.g. Dinner at beach" required>
          </label>
          <div class="two-col">
            <label>Amount
              <input id="expAmount" type="number" min="0.01" step="0.01" required>
            </label>
            <label>Date
              <input id="expDate" type="date" required>
            </label>
          </div>
          <div class="two-col">
            <label>Paid by
              <select id="expPayer" required></select>
            </label>
            <label>Category
              <select id="expCategory">
                <option>Food</option>
                <option>Travel</option>
                <option>Stay</option>
                <option>Entertainment</option>
                <option>Shopping</option>
                <option>Other</option>
              </select>
            </label>
          </div>
          <fieldset class="split">
            <legend>Split among</legend>
            <div id="splitList" class="checks"></div>
          </fieldset>
          <button type="submit" class="btn">Add Expense</button>
        </form>
      </section>
    </div>

    <div class="grid">
      <section class="panel">
        <h2>Balances</h2>
        <div id="balanceList"></div>
      </section>

      <section class="panel">
        <h2>Who Pays Whom</h2>
        <div id="settleList"></div>
      </section>
    </div>

    <section class="panel">
      <div class="row-between">
        <h2>Expenses</h2>
        <input id="searchExp" class="search" type="search" placeholder="Search description or category">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th><th>Description</th><th>Category</th>
              <th>Paid by</th><th>Split</th><th class="right">Amount</th><th></th>
            </tr>
          </thead>
          <tbody id="expBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
